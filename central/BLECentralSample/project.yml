# XcodeGen のプロジェクト定義（このファイルが Xcode プロジェクトの source of truth）。
# `xcodegen generate` で BLECentralSample.xcodeproj を生成する（.xcodeproj は .gitignore）。
# 雛形は iOSAppTemplate(Genesis) で一度生成したものを固定したもの。実行時に
# iOSAppTemplate へは依存しない（テンプレの破壊的変更の影響を受けない。DESIGN-001 D-7）。
name: BLECentralSample

options:
  bundleIdPrefix: com.example.ble
  developmentLanguage: ja
  knownRegions: [ja]
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  BLECentralSample:
    type: application
    platform: iOS
    sources:
      - path: BLECentralSample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ble.BLECentralSample
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: BLECentralSample/Info.plist
      properties:
        CFBundleDisplayName: BLECentralSample
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
